context:
  version: "0.2.5"

package:
  name: polars-io-tools
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/78/d9/2e8adf81329d2a9119768f0b8d699899c74fed426fd093ac6e5ddad0b877/polars_io_tools-${{ version }}.tar.gz
  sha256: cfe382f3dbff222f168d790d9e6f8aa4e0734366e8b10e82632eaffc4733b1fe

build:
  number: 0
  python:
    version_independent: true
  script:
    - if: unix
      then: export PYO3_PYTHON="$PYTHON"
      else: set "PYO3_PYTHON=%PYTHON%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: is_abi3 and not is_python_min

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
        - crossenv
        - hatchling
        - hatch-rs
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-rs
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python >=${{ python_min }}
    - packaging
    - polars
    - portion
    - pydantic

tests:
  - python:
      imports:
        - polars_io_tools
      # deltalake 1.5.0 has macOS WHEEL tags for macosx_26_0,
      # which makes pip check fail on older CI runners despite valid imports.
      pip_check: ${{ not osx }}
      python_version:
        - ${{ python_min }}.*
        - "*"
  - if: is_abi3
    then:
      script:
        - if: win
          then: abi3audit %SP_DIR%/polars_io_tools/polars_io_tools.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit $SP_DIR/polars_io_tools/polars_io_tools.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      requirements:
        run:
          - python >=${{ python_min }}
          - abi3audit

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Custom parsing extensions for lazy polars
  homepage: https://github.com/Point72/polars-io-tools
  repository: https://github.com/Point72/polars-io-tools

extra:
  recipe-maintainers:
    - hintse
    - arhamchopra
    - ptomecek
    - timkpaine
